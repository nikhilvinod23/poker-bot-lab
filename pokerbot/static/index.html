<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOLD'EM / ASCII</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/sidebar.css"></head><body>
<header><a href="/">[ H / E ]</a><span>HOLD'EM</span><button id="history">LOGS [↗]</button></header>
<main><section id="setup"><div class="eyebrow">01 / TABLE SETUP</div><h1>PLAY YOUR<br><em>HAND.</em></h1><div class="config"><label>HANDS <input id="rounds" type="number" min="1" max="99" value="20"></label><label class="human"><input type="checkbox" id="human" checked> HUMAN SEAT</label><div id="bots"></div><button id="add">+ ADD BOT</button><div class="small">100 CHIPS / BLINDS 1 : 2 / NO LIMIT</div><button class="primary" id="start">DEAL →</button></div></section>
<section id="game" hidden><div class="bar"><span id="round"></span><span id="street"></span><button id="reset">RESET [×]</button></div><div class="play-layout"><div class="play-table"><div id="table"><div id="seats"></div><div class="center"><span id="pot"></span><div id="board" class="cards"></div><div id="outcome"></div></div></div><div id="actions"></div><div class="footer"><button id="log">ACTION LOG [+]</button><span id="status" role="status"></span></div></div><aside id="publiclog"></aside></div><section id="stats" hidden></section></section>
<p id="error" role="alert"></p></main><dialog id="drawer"><div class="bar"><strong id="logtitle">LOG</strong><button id="close">CLOSE [×]</button></div><div id="logbody"></div></dialog><script src="/static/app.js"></script></body></html>
